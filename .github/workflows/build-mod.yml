name: Build Lemuroid Mod APK

on:
  push:
    branches:
      - mod-cheat-speed-time
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (cores included)
        run: ./gradlew --no-daemon assembleFreeBundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-mod-apk
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
