name: Build Lemuroid Mod APK

on:
  push:
    branches:
      - mod-cheat-speed-time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (cores included)
        run: |
          ./gradlew --no-daemon assembleFreeBundleDebug
          mkdir -p out
          cp lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk out/lemuroid-mod.apk

      - name: Build second copy (link cable partner)
        run: |
          ./gradlew --no-daemon assembleFreeBundleDebug -PmodCopy=2
          cp lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk out/lemuroid-mod-2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-mod-apk
          path: out/lemuroid-mod.apk

      - name: Upload second copy
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-mod-2-apk
          path: out/lemuroid-mod-2.apk

      - name: Publish APKs as a release (direct download links)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view mod-latest >/dev/null 2>&1; then
            gh release upload mod-latest out/lemuroid-mod.apk out/lemuroid-mod-2.apk --clobber
          else
            gh release create mod-latest out/lemuroid-mod.apk out/lemuroid-mod-2.apk \
              --target "$GITHUB_SHA" \
              --title "Lemuroid Mod" \
              --notes "Unofficial personal build of Lemuroid with DS cheats, selectable game speed, console clock offset and Game Boy link cable. Not affiliated with the Lemuroid project."
          fi
